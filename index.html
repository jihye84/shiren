<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>중국 시인 연표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면 고정: 머리줄 / 연표 캔버스(끌어서 이동·집어서 확대) / 상세는 아래 서랍 */
:root{
  --paper:#F2F4EF; --card:#FBFCF9; --ink:#1A231F; --muted:#5D6A64; --line:#D5DCD5;
  --jade:#1E6A58; --jade-soft:#DCEBE5; --bar:#E4EDE8; --bar-line:#9FBDB2; --seal:#B5372C;
  --gold:#C89B1E; --gold-soft:#F5E7B8; --band1:#E3E8E1; --band2:#D4DDD5; --event:rgba(181,55,44,.08);
  --hz:"Noto Serif SC","Songti SC","STSong",serif;
  --ko:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --kod:"Gowun Batang","AppleMyungjo","Batang",serif;
  --py:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201C; --ink:#E5ECE7; --muted:#97A59E; --line:#2C3832;
  --jade:#6CBCA4; --jade-soft:#1F3229; --bar:#1E2A24; --bar-line:#3D5A4F; --seal:#E2766A;
  --gold:#E3BE4F; --gold-soft:#3A3218; --band1:#1A231F; --band2:#222D27; --event:rgba(226,118,106,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201C; --ink:#E5ECE7; --muted:#97A59E; --line:#2C3832;
  --jade:#6CBCA4; --jade-soft:#1F3229; --bar:#1E2A24; --bar-line:#3D5A4F; --seal:#E2766A;
  --gold:#E3BE4F; --gold-soft:#3A3218; --band1:#1A231F; --band2:#222D27; --event:rgba(226,118,106,.10); color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--ko);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{margin:0;font-family:var(--kod);font-weight:700;font-size:min(5.4vw,22px);display:flex;align-items:center;gap:8px}
.seal{font-family:var(--hz);background:var(--seal);color:var(--card);border-radius:4px;padding:2px 5px;font-size:.78em;line-height:1.1}
.legend{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:4px}
.dia{width:9px;height:9px;transform:rotate(45deg);display:inline-block;background:var(--gold);border:1.5px solid var(--gold);box-sizing:border-box}
.dia.est{background:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:var(--seal);display:inline-block}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--card)}
.chip.toggle[aria-pressed="true"]{background:var(--jade-soft);color:var(--jade);border-color:var(--jade)}
.spacer{flex:1}

.tl{position:relative;min-height:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tl.drag{cursor:grabbing}
.tl > *{position:absolute}
.tick{top:0;bottom:0;border-left:1px dashed var(--line)}
.tick span{position:absolute;top:4px;left:4px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dyn{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-size:12px;border-right:1px solid var(--card)}
.dyn b{font-family:var(--hz);font-weight:700;margin-right:3px}
.sub{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-size:10.5px;color:var(--muted);border-right:1px solid var(--line)}
.dynline{border-left:1px solid var(--line)}
.ev{background:var(--event);border-left:1px solid var(--seal);border-right:1px solid var(--seal);opacity:.9}
.ev span{position:absolute;bottom:4px;left:4px;font-size:10.5px;color:var(--seal);white-space:nowrap}
.bar{background:var(--bar);border:1px solid var(--bar-line);border-radius:999px;box-sizing:border-box;cursor:pointer}
.bar.mine{background:var(--jade-soft);border-color:var(--jade)}
.bar.sel{outline:2px solid var(--jade);outline-offset:1px}
.bar.circa{border-style:dashed}
.lab{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px;cursor:pointer;line-height:1}
.lab.sel .hz{color:var(--jade)}
.lab .hz{font-family:var(--hz);font-weight:700}
.lab .kr{color:var(--muted)}
.lab .kn{font-family:var(--kod);font-weight:700}
.lab .hzs{font-family:var(--hz);color:var(--muted);font-weight:500}
.lab.sel .kn{color:var(--jade)}
.gm{width:var(--s);height:var(--s);transform:translate(-50%,-50%) rotate(45deg);background:var(--gold);border:1.5px solid var(--gold);box-sizing:border-box;cursor:pointer;z-index:2}
.gm.est{background:var(--card)}
.gm:hover,.gm.sel{box-shadow:0 0 0 3px var(--gold-soft)}
.zoom{right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.bar::before,.gm::before{content:"";position:absolute;inset:-9px -2px}
.gm::before{inset:-7px}
.hint{left:10px;bottom:10px;pointer-events:none;font-size:11px;color:var(--muted);z-index:4;background:var(--card);padding:2px 6px;border-radius:6px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 24px rgba(0,0,0,.14);max-height:58%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet-in{overflow:auto;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(18px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:680px;margin:0 auto;width:100%;box-sizing:border-box}
@media (min-width:900px){.sheet{left:auto;top:0;width:400px;max-height:none;border-radius:18px 0 0 18px;border-top:0;border-left:1px solid var(--line);transform:translateX(105%)}
  .sheet-in{padding-top:calc(env(safe-area-inset-top,0px) + 16px)}}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-name{display:grid;gap:2px}
.sh-name .hz{font-family:var(--hz);font-weight:700;font-size:28px;line-height:1.1}
.sh-name .kr{font-family:var(--kod);font-size:15px}
.sh-name .py{font-family:var(--py);color:var(--jade);font-size:13px}
.close{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;flex:none}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.desc{font-family:var(--kod);font-size:15px;line-height:1.65;margin:0}
.works{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.works li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.works li.sel{border-color:var(--gold);background:var(--gold-soft)}
.works .yr{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:6px;padding-top:3px}
.works .t{font-family:var(--hz);font-weight:700;font-size:16px}
.works .n{grid-column:2;font-size:13.5px;line-height:1.55;color:var(--muted)}
.qbox{border-left:3px solid var(--seal);padding:6px 10px;background:var(--paper);border-radius:0 8px 8px 0}
.qbox .lbl{font-size:12px;color:var(--seal);font-weight:700}
.qbox .q{font-family:var(--hz);font-size:17px;line-height:1.6}
.h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-top:4px}

.inapp{position:fixed;inset:0;z-index:40;background:var(--paper);display:grid;place-items:center;padding:24px;text-align:center}
.inapp div{max-width:320px;display:grid;gap:12px;font-size:15px;line-height:1.6}
.inapp button{border:0;background:var(--jade);color:var(--card);border-radius:10px;padding:10px}
.inapp .skip{background:transparent;color:var(--muted);border:1px solid var(--line)}
.go{grid-column:2;justify-self:start;margin-top:2px;border:1px solid var(--jade);background:transparent;color:var(--jade);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
/* 감상 화면: 머리줄 / 그림 / 구절(쪽 넘김) / 조작줄 — 스크롤 없음 */
.reader{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.reader > *{max-width:720px;width:100%;margin:0 auto;box-sizing:border-box}
.rh{display:flex;align-items:center;gap:10px;min-width:0}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:17px}
.ib svg{width:20px;height:20px}
.rt{min-width:0;flex:1;display:grid;gap:1px}
.rt .t1{font-family:var(--hz);font-weight:700;font-size:min(5.6vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .t2 b{font-weight:400;color:var(--jade);font-family:var(--py)}
.pic{position:relative;height:clamp(110px,28vh,300px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.pic canvas{width:100%;height:100%;display:block}
.pic .tag{position:absolute;left:10px;top:10px;font-size:12px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.pic .tag.ex{left:auto;right:10px;color:var(--seal);border-color:var(--seal)}
.lines{position:relative;min-height:0;overflow:hidden;container-type:inline-size}
.ln{display:grid;gap:3px;width:100%;text-align:center;border:0;background:transparent;border-radius:12px;padding:6px 6px 8px;cursor:pointer;margin-bottom:4px}
.ln:hover{background:var(--card)}
.ln.on{background:var(--gold-soft)}
.ln .zh{font-family:var(--hz);font-weight:700;line-height:1;font-size:var(--fz);letter-spacing:.02em}
.ln .zh ruby{ruby-position:over;margin:0 .07em}
.ln .zh rt{font-family:var(--py);font-weight:500;font-size:max(.33em,10px);color:var(--jade);padding-bottom:.18em;letter-spacing:0}
.ln .zh .pu{color:var(--muted);font-weight:500}
.ln .ko{font-family:var(--kod);font-size:var(--kz,min(3.9vw,15px));line-height:1.45;color:var(--ink);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.reader.nopy .ln rt{visibility:hidden}
.reader.noko .ln .ko{visibility:hidden}
.rf{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rf .nav{border:1px solid var(--line);background:var(--card);border-radius:12px;height:48px;padding:0 16px;font-size:15px}
.rf .nav:disabled{opacity:.35;cursor:default}
.play{border:0;background:var(--jade);color:var(--card);border-radius:12px;height:48px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.play small{font-weight:400;opacity:.85;font-variant-numeric:tabular-nums}
.wd-scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:34}
.wd{position:fixed;top:0;right:0;bottom:0;width:min(88vw,380px);z-index:35;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) 16px;transform:translateX(105%);transition:transform .22s ease}
.wd.open{transform:none}
.wd h2{margin:0;font-family:var(--kod);font-size:17px;display:flex;align-items:center}
.wd h2 .ib{margin-left:auto}
.wd .about{font-size:13.5px;line-height:1.6;color:var(--ink);font-family:var(--kod)}
.wd .about .m{color:var(--muted);font-family:var(--ko);font-size:12.5px}
.set{display:grid;gap:8px;font-size:14px}
.set label{display:flex;align-items:center;gap:8px}
.set input[type=checkbox]{accent-color:var(--jade);width:18px;height:18px}
.set input[type=range]{flex:1;accent-color:var(--jade)}
.wlist{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:1px}
.wlist > *{flex:none}
.wlist .g{font-size:13px;font-weight:700;color:var(--ink);margin:12px 0 2px;padding:0 8px;letter-spacing:.02em}
.wlist .g:first-child{margin-top:4px}
.wlist button{border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:8px;display:grid;gap:2px;min-height:44px;align-content:center}
.wlist button .wt{font-family:var(--hz);font-size:15.5px;line-height:1.3}
.wlist button .wk{font-family:var(--kod);font-size:12.5px;color:var(--muted);line-height:1.35}
.wlist button[aria-current="true"] .wk{color:var(--jade)}
.wlist button[aria-current="true"]{background:var(--jade-soft);color:var(--jade)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:50;background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 14px;font-size:13px;line-height:1.5;width:min(86vw,420px);text-align:center;box-sizing:border-box}
.vrow{display:flex;align-items:center;gap:10px}
.vseg{display:flex;background:var(--jade-soft);border-radius:999px;padding:3px}
.vseg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--card);color:var(--jade);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.set select{flex:1;min-width:0;font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.set .m{font-size:12px;color:var(--muted);line-height:1.5}
.rt .t1,.rt .t2{cursor:pointer;border-radius:6px;transition:background .15s}
.rt .t1.on,.rt .t2.on{background:var(--gold-soft)}
.rt .t3{font-family:var(--kod);font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .t4{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rt .t4 .pk{font-family:var(--kod);font-weight:700}
.rt .t4 .ph{font-family:var(--hz)}
.rt .t4 b{font-weight:500;color:var(--jade);font-family:var(--py)}
.rt .t4 .m{color:var(--muted)}
.rt .t4{cursor:pointer;border-radius:6px}
.rt .t4.on{background:var(--gold-soft)}
.rf .nav.wk{font-size:13.5px;padding:0 12px;color:var(--jade)}
@media (orientation:landscape) and (max-height:540px){
  .reader{grid-template-columns:minmax(0,36%) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:14px}
  .reader > *{max-width:none}
  .rh,.rf{grid-column:1/-1}
  .pic{grid-row:2;grid-column:1;height:auto}
  .lines{grid-row:2;grid-column:2}
  .rt .t3{display:none}
  .rf .nav,.play{height:42px}
}
/* 대구 짝 색 */
:root{--d0:#B5372C;--d1:#2D5FA8;--d2:#A9740A;--d3:#7A4AA6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--d0:#EE8A7E;--d1:#86AEEB;--d2:#E6BC5C;--d3:#C3A0E6}}
:root[data-theme="dark"]{--d0:#EE8A7E;--d1:#86AEEB;--d2:#E6BC5C;--d3:#C3A0E6}
.du{border-bottom:.07em solid currentColor;padding-bottom:.03em}
/* 밑줄이 풀이와 겹치지 않도록 한자 줄 아래 여유 */
.ln .zh{padding-bottom:.2em}
.reader.nodui .ln .zh{padding-bottom:.06em}
.du.d0{color:var(--d0)}.du.d1{color:var(--d1)}.du.d2{color:var(--d2)}.du.d3{color:var(--d3)}
.reader.nodui .du{color:inherit;border-bottom-color:transparent}

/* ── 문인화 테마: 화선지 · 먹 · 석청 · 주사 인주 · 비단 표구 ──
   붓글씨(马善政)는 제목·시인·왕조 한자에만 쓰고, 시 본문은 명조(宋体)로 읽기 쉽게 둔다 */
:root{
  --paper:#E9E8E1; --card:#F4F3EE; --ink:#23221F; --muted:#6A675F; --line:#CFCCC1;
  --jade:#2F6672; --jade-soft:#DCE6E6; --seal:#A8352A; --gold:#B48A2C; --gold-soft:#EFE3BF;
  --bar:#3B3934; --bar-line:#3B3934; --band1:#DEDCD3; --band2:#D2CFC4; --silk:#CFC8B5; --event:rgba(168,53,42,.07);
  --brush:"Ma Shan Zheng","Noto Serif SC","STKaiti","KaiTi",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171714; --card:#1F1F1B; --ink:#E9E6DC; --muted:#A29E92; --line:#3A3832;
  --jade:#7DB4BC; --jade-soft:#22302F; --seal:#E07C6E; --gold:#DDB858; --gold-soft:#3A3219;
  --bar:#CFCBBF; --bar-line:#CFCBBF; --band1:#22221E; --band2:#2A2925; --silk:#3E3A30; --event:rgba(224,124,110,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171714; --card:#1F1F1B; --ink:#E9E6DC; --muted:#A29E92; --line:#3A3832;
  --jade:#7DB4BC; --jade-soft:#22302F; --seal:#E07C6E; --gold:#DDB858; --gold-soft:#3A3219;
  --bar:#CFCBBF; --bar-line:#CFCBBF; --band1:#22221E; --band2:#2A2925; --silk:#3E3A30; --event:rgba(224,124,110,.09); color-scheme:dark}
/* 화선지 결 */
body{background-color:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .42  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* 머리 */
h1{font-family:var(--kod);letter-spacing:-.01em}
h1 .seal{font-family:var(--brush);font-weight:400;font-size:1.05em;padding:3px 6px 1px;border-radius:3px;background:var(--seal);color:var(--card);box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(255,255,255,.35)}
.legend{gap:12px}
.chip{border-radius:4px;border-color:var(--line);background:transparent;padding:5px 12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.toggle[aria-pressed="true"]{background:var(--jade-soft);color:var(--jade);border-color:var(--jade)}

/* 연표 바탕 */
.tl{background:var(--card);border-radius:6px;border-color:var(--line)}
.tick{border-left:1px solid var(--line);opacity:.55}
.tick span{opacity:1}
.dyn{font-size:12px;color:var(--muted);border-right:1px solid var(--card)}
.dyn b{font-family:var(--brush);font-weight:400;font-size:17px;color:var(--ink);margin-right:4px}
.sub{font-size:10.5px}
.ev{background:var(--event);border-left:1px dashed var(--seal);border-right:1px dashed var(--seal)}

/* 생존 막대 = 먹선: 붓을 대고 떼는 양 끝을 가늘게 */
.bar{border:0;border-radius:999px;background-repeat:no-repeat;background-position:center;background-size:100% 55%;background-image:linear-gradient(90deg,transparent,var(--bar) 5%,var(--bar) 95%,transparent);opacity:.7}
.bar.mine{background-image:linear-gradient(90deg,transparent,var(--jade) 5%,var(--jade) 95%,transparent);opacity:1;background-size:100% 75%}
.bar.circa{background-image:repeating-linear-gradient(90deg,var(--bar) 0 5px,transparent 5px 8px);opacity:.5}
.bar.mine.circa{background-image:repeating-linear-gradient(90deg,var(--jade) 0 5px,transparent 5px 8px);opacity:.85}
.bar.sel{outline:2px solid var(--seal);outline-offset:2px;opacity:1}
.lab .kn{color:var(--ink)}
.lab .hzs{font-family:var(--brush);font-weight:400;font-size:1.12em;color:var(--muted)}
.lab.sel .kn{color:var(--seal)}
.dot{background:var(--seal);border-radius:1px;transform:rotate(45deg);width:6px;height:6px}
.lg .dot{margin:0 1px}
.zoom button{border-radius:4px;background:var(--card)}
.hint{background:transparent}

/* 시인 서랍 = 족자 */
.sheet{background:var(--card);border-radius:4px 4px 0 0;border-top:0;box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(0,0,0,.12)}
.sheet::before{content:"";display:block;height:8px;background:var(--silk);border-bottom:1px solid var(--line)}
@media (min-width:900px){.sheet{border-radius:0}.sheet::before{display:none}.sheet{border-left:8px solid var(--silk)}}
.sh-name .hz{font-family:var(--brush);font-weight:400;font-size:40px;line-height:1}
.sh-name .kr{font-size:16px;font-weight:700}
.close{border-radius:4px}
.desc{font-size:15.5px;line-height:1.75}
.qbox{background:transparent;border-left:3px solid var(--seal);border-radius:0}
.works li{border-radius:4px;background:transparent}
.works li.sel{background:var(--gold-soft);border-color:var(--gold)}
.works .t{font-family:var(--brush);font-weight:400;font-size:20px}
.go{border-radius:4px;border-color:var(--ink);color:var(--ink);font-weight:400}
.go:hover{background:var(--ink);color:var(--paper)}

/* 감상 화면 */
.reader{background-color:var(--paper);background-image:inherit}
.ib{border-radius:4px;background:transparent}
.rt .t1{font-family:var(--brush);font-weight:400;font-size:min(7.4vw,30px);line-height:1.15}
.rt .t3{font-size:14px}
/* 그림 = 비단으로 표구한 족자 */
.pic{border:0;border-radius:2px;background:var(--silk);padding:7px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pic canvas{border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.pic .tag{border-radius:3px;top:15px;left:15px;background:var(--card)}
.pic .tag.ex{left:auto;right:15px}
.ln{border-radius:4px}
.ln:hover{background:rgba(127,120,100,.08)}
.ln.on{background:var(--gold-soft)}
.ln .zh rt{color:var(--jade)}
.rf .nav{border-radius:4px;background:transparent;border-color:var(--line)}
.rf .nav.wk{color:var(--ink)}
.play{border-radius:4px;background:var(--ink);color:var(--paper)}
.play small{opacity:.7}
.wd{background:var(--card)}
.wd h2{font-family:var(--kod)}
.vseg{border-radius:4px}.vseg button{border-radius:3px}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.set select{border-radius:4px}
.wlist .g{font-family:var(--kod)}
.wlist button{border-radius:4px}
.wlist button .wt{font-family:var(--brush);font-size:18px}
.wlist button[aria-current="true"]{background:var(--jade-soft)}
.toast{border-radius:4px}
.inapp button{border-radius:4px;background:var(--ink);color:var(--paper)}
/* 그림: 테두리 없이 가장자리가 종이에 스며들게 */
.pic{background:transparent;padding:0;border:0;box-shadow:none;border-radius:0;overflow:visible}
.pic canvas{box-shadow:none;border-radius:0;-webkit-mask-image:radial-gradient(ellipse 62% 60% at 50% 50%,#000 48%,transparent 100%);mask-image:radial-gradient(ellipse 62% 60% at 50% 50%,#000 48%,transparent 100%)}
.pic .tag{top:6px;left:2px;background:transparent;border-color:var(--line)}
.pic .tag.ex{left:auto;right:2px}
@media (prefers-reduced-motion:reduce){.sheet,.wd{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <h1><span class="seal">詩</span>중국 시인 연표</h1>
    <div class="legend">
      <span class="lg"><i class="dia"></i>작품 연도</span>
      <span class="lg"><i class="dia est"></i>추정 연도</span>
      <span class="lg"><i class="dot"></i>받아치기 수록</span>
    </div>
  </header>
  <div class="tools" id="tools">
    <button class="chip" data-r="-600,1930">전체</button>
    <button class="chip" data-r="-600,460">선진~육조</button>
    <button class="chip" data-r="640,880" aria-pressed="true">당</button>
    <button class="chip" data-r="930,1300">송</button>
    <button class="chip" data-r="1230,1930">원·명·청</button>
    <span class="spacer"></span>
    <button class="chip toggle" id="onlyApp" aria-pressed="false">수록 시인만</button>
  </div>
  <div class="tl" id="tl" aria-label="연표: 끌어서 이동, 두 손가락이나 휠로 확대"></div>
</div>

<aside class="sheet" id="sheet" aria-live="polite"><div class="sheet-in" id="sheetIn"></div></aside>

<section class="reader" id="reader" hidden aria-label="작품 감상">
  <header class="rh">
    <button class="ib" id="rBack" aria-label="연표로 돌아가기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="rt"><div class="t1" id="rTitle"></div><div class="t3" id="rKt"></div><div class="t2" id="rSub"></div><div class="t4" id="rPoet"></div></div>
    <button class="ib" id="rMenu" aria-label="작품 목록과 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div class="pic"><canvas id="pic" aria-hidden="true"></canvas><span class="tag" id="rKind"></span><span class="tag ex" id="rEx" hidden>발췌</span></div>
  <div class="lines" id="lines"></div>
  <footer class="rf">
    <button class="nav" id="pPrev" aria-label="앞쪽">◀</button>
    <button class="play" id="pPlay"><span id="pPlayT">▶ 전체 듣기</span><small id="pPage"></small></button>
    <button class="nav" id="pNext" aria-label="뒤쪽">▶</button>
  </footer>
</section>
<div class="wd-scrim" id="wdScrim" hidden></div>
<aside class="wd" id="wd" aria-label="작품 목록과 설정">
  <h2>작품 · 설정<button class="ib" id="wdClose" aria-label="닫기">✕</button></h2>
  <div class="about" id="wdAbout"></div>
  <div class="set">
    <label><input type="checkbox" id="oPy" checked> 병음 보이기</label>
    <label><input type="checkbox" id="oKo" checked> 우리말 풀이 보이기 (끄고 외워 보기)</label>
    <label><input type="checkbox" id="oDui" checked> 대구 짝 색으로 표시 <span class="m">(같은 색끼리 짝)</span></label>
    <div class="vrow"><span>목소리</span><div class="vseg" id="oVmode" role="group" aria-label="목소리"><button data-v="f">여자</button><button data-v="m">남자</button></div></div>
    <label>음성 <select id="oVoice"></select></label>
    <div class="m" id="oVoiceNote"></div>
    <label>속도 <input type="range" id="oRate" min="0.5" max="1.1" step="0.05" value="0.75"><span id="oRateV" class="m">0.75</span></label>
  </div>
  <div class="wlist" id="wlist"></div>
</aside>

<div class="inapp" id="inapp" hidden><div>
  <b>기본 브라우저에서 열어 주세요</b>
  <span>앱 안 브라우저에서는 화면이 제대로 보이지 않을 수 있어요. ⋯ 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러 주세요.</span>
  <button id="copyLink">링크 복사</button>
  <button class="skip" id="skipInapp">그냥 여기서 보기</button>
</div></div>

const P=[
 {h:"孔子",k:"공자",py:"Kǒng Zǐ",b:-551,d:-479,era:"춘추",desc:"유가의 시조예요. 시인은 아니지만 제자들이 그의 말을 모은 《논어》는 중국 사람들이 가장 많이 인용하는 고전이고, 《시경》을 엮었다는 전승도 있어요.",

 {h:"屈原",k:"굴원",py:"Qū Yuán",b:-340,d:-278,cb:1,era:"전국 · 초",desc:"초나라의 귀족 정치가예요. 모함으로 쫓겨난 뒤 멱라강에 몸을 던졌고, 단오의 쭝쯔와 용선 경주가 그를 기리는 풍습에서 나왔다고 전해요. 《초사(楚辞)》의 대표 작가예요.",

 {h:"曹操",k:"조조",py:"Cáo Cāo",b:155,d:220,era:"후한 말",desc:"삼국지의 그 조조예요. 위나라의 기초를 세운 정치가이자, 아들 조비·조식과 함께 건안문학을 이끈 시인이에요.",
  w:[{t:"观沧海",y:207,n:"오환 원정에서 돌아오는 길에 갈석산에 올라 바다를 보고 지음. 东临碣石，以观沧海."},{t:"短歌行",y:208,est:1,n:"对酒当歌，人生几何 — 술자리에서 지금도 자주 읊는 구절."}]},
 {h:"曹植",k:"조식",py:"Cáo Zhí",b:192,d:232,era:"삼국 · 위",desc:"조조의 아들이에요. 형 조비의 견제 속에 살았고, '일곱 걸음 안에 시를 지어라'는 칠보시(七步诗) 전설의 주인공이에요.",

 {h:"王勃",k:"왕발",py:"Wáng Bó",b:650,d:676,cb:1,era:"초당",desc:"초당사걸(初唐四杰) 중 한 명이에요. 귀양 간 아버지를 뵈러 가던 길에 바다에 빠져 스물대여섯에 세상을 떠났어요.",

 {h:"陈子昂",k:"진자앙",py:"Chén Zǐ'áng",b:659,d:700,era:"초당",desc:"육조의 화려하기만 한 문풍을 비판하고 기개 있는 시를 주장해 성당 시의 길을 연 시인이에요.",

 {h:"王翰",k:"왕한",py:"Wáng Hàn",b:687,d:726,cb:1,cd:1,era:"성당",desc:"호방한 성격의 부잣집 출신 시인이에요. 전하는 작품은 적지만 〈량주사〉 한 수로 이름을 남겼어요. 생몰년은 대략이에요.",

 {h:"王之涣",k:"왕지환",py:"Wáng Zhīhuàn",b:688,d:742,era:"성당",desc:"왕창령·고적과 술집에 갔다가 기생들이 누구 시를 많이 부르나 내기했다는 '기정화벽(旗亭画壁)' 일화로 유명해요.",

 {h:"孟浩然",k:"맹호연",py:"Mèng Hàorán",b:689,d:740,era:"성당",desc:"평생 벼슬 없이 산 전원·산수 시인이에요. 이백이 그를 존경해 〈황학루에서 광릉 가는 맹호연을 보내며〉를 지었어요.",

 {h:"王昌龄",k:"왕창령",py:"Wáng Chānglíng",b:698,d:756,cb:1,era:"성당",desc:"칠언절구의 대가라 '칠절성수(七绝圣手)'로 불려요. 변방을 노래한 시가 특히 유명해요.",

const $=s=>document.querySelector(s);
const tl=$("#tl");
const BOUND=[-800,1960];
let view={s:640,e:880},onlyApp=false,sel={p:null,w:null};
const fy=y=>y<0?`BC ${-y}`:`${y}`;

function lanes(list){const ends=[];const L=new Map();[...list].sort((a,b)=>a.b-b.b).forEach(p=>{let i=ends.findIndex(e=>e+14<p.b);if(i<0){i=ends.length;ends.push(0)}ends[i]=p.d;L.set(p.id,i)});return {L,n:ends.length}}
let laneInfo;
function vis(){return onlyApp?P.filter(p=>p.app):P}
function relane(){laneInfo=lanes(vis())}
relane();

function niceStep(span,W){const target=span/Math.max(3,Math.floor(W/90));const st=[5,10,20,25,50,100,200,250,500,1000];return st.find(s=>s>=target)||1000}

function render(){
  const W=tl.clientWidth,H=tl.clientHeight;const span=view.e-view.s;const k=W/span;const X=y=>(y-view.s)*k;
  const axisH=22,bandH=28,subH=16,top=axisH+bandH+subH+8;
  const nL=laneInfo.n;const laneH=Math.max(15,Math.min(48,(H-top-14)/nL));const tight=laneH<24;
  let h="";
  // 사건 띠
  EV.forEach(([a,b,t])=>{const x=X(a),w=Math.max(2,X(b)-x);if(x+w<0||x>W)return;h+=`<div class="ev" style="left:${x}px;width:${w}px;top:${axisH+bandH+subH}px;bottom:0"><span>${w>40||span<300?t:""}</span></div>`});
  // 눈금
  const st=niceStep(span,W);for(let y=Math.ceil(view.s/st)*st;y<=view.e;y+=st){h+=`<div class="tick" style="left:${X(y)}px"><span>${fy(y)}</span></div>`}
  // 왕조
  DYN.forEach(([a,b,ko,hz],i)=>{const x=X(a),w=X(b)-x;if(x+w<0||x>W)return;const lab=w>70?`<b>${hz}</b>${ko}`:w>30?`<b>${hz}</b>`:w>14?`<b>${hz[0]}</b>`:"";

const muteMsg="이 화면에서는 낭독이 막혀 있어요. 크롬·사파리에서 열면 소리가 나요.";
function say(text,onend){if(!SS){toast(muteMsg);onend&&onend(false);return}

  u.onstart=()=>{started=true};u.onend=()=>fin(true);u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled"){toast(muteMsg)}fin(false)};

    for(let x=0;x<=W;x+=4){const t=x/W;const y=base-amp*(.55+.45*Math.sin(t*f1*Math.PI+p1))*(.7+.3*Math.sin(t*f2*Math.PI+p2))-rough*Math.sin(t*37+p2)*R_(.3,1);g.lineTo(x,y)}

    g.fillStyle=C(OCHRE,.95);for(let i=0;i<9;i++){g.beginPath();g.arc(x+R_(-u*.6,u*.6),y-u*.55+R_(-2,2),3,0,7);g.fill()}
    g.strokeStyle=C(OCHRE,.9);g.lineWidth=2;for(let i=0;i<5;i++){g.beginPath();g.moveTo(x-u*.8+i*u*.4,H);g.lineTo(x-u*.6+i*u*.3,y+u*.15);g.stroke()}}
}
